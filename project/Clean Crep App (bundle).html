<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0D1524;
    font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column;
  }

  /* Top bar */
  #topbar {
    flex-shrink: 0;
    height: 52px;
    background: #0A1F44;
    border-bottom: 1px solid rgba(168,200,240,0.12);
    display: flex; align-items: center; padding: 0 28px;
    gap: 16px;
  }
  #topbar .logo-wrap { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
  #topbar .logo-wrap img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  #topbar .brand { font-size: 13px; font-weight: 500; color: #fff; }
  #topbar .tagline { font-size: 11px; color: #A8C8F0; }
  #topbar .sep { width: 1px; height: 24px; background: rgba(168,200,240,0.15); margin: 0 8px; }

  /* Canvas */
  #canvas {
    flex: 1; min-height: 0;
    overflow-x: auto; overflow-y: hidden;
    display: flex; align-items: center;
    padding: 32px 48px;
    gap: 36px;
  }
  #canvas::-webkit-scrollbar { height: 6px; }
  #canvas::-webkit-scrollbar-track { background: transparent; }
  #canvas::-webkit-scrollbar-thumb { background: rgba(168,200,240,0.2); border-radius: 3px; }

  /* Phone wrapper */
  .phone-wrapper {
    display: flex; flex-direction: column; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .phone-label {
    font-size: 11px; font-weight: 500; color: #A8C8F0;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .phone-sublabel {
    font-size: 10px; color: rgba(168,200,240,0.5);
    margin-top: -10px; letter-spacing: 0.5px;
  }

  /* Outer device shell */
  .device-shell {
    width: 375px; height: 780px;
    border-radius: 50px;
    background: #1c1c1e;
    box-shadow:
      0 0 0 1.5px #3a3a3c,
      0 40px 80px rgba(0,0,0,0.6),
      0 8px 24px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
    flex-shrink: 0;
  }

  /* Screen bg */
  .device-screen {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-radius: 46px;
    background: #F5F7FA;
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* Dynamic island */
  .dynamic-island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 50;
    pointer-events: none;
  }

  /* Status bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 40;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 8px;
    pointer-events: none;
  }
  .status-bar .time {
    font-size: 15px; font-weight: 600;
    font-family: -apple-system, system-ui;
    color: #000; letter-spacing: -0.3px;
  }
  .status-bar.dark-bar .time { color: #fff; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* Home indicator */
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 5px; border-radius: 100px; background: rgba(0,0,0,0.22); z-index: 50;
    pointer-events: none;
  }

  /* Content area */
  .screen-content {
    position: absolute; inset: 0;
    overflow: hidden;
    border-radius: 46px;
  }

  /* Input reset */
  input, textarea { -webkit-appearance: none; appearance: none; }
  input:focus, textarea:focus { outline: 2px solid #1A6FD4; outline-offset: -1px; }
</style>
</head>

<script type="text/babel">
const { useState } = React;

// Mount each screen independently
function mountScreen(id, element) {
  const container = document.getElementById(id);
  if (!container) return;
  const root = ReactDOM.createRoot(container);
  root.render(element);
}

// Each phone is its own isolated app shell
function makeShell(initial) {
  return function Shell() {
    const [screen, setScreen] = useState(initial);
    const screens = {
      home:    <HomeScreen          onNavigate={setScreen} />,
      book:    <BookingScreen       onNavigate={setScreen} />,
      orders:  <OrdersScreen        onNavigate={setScreen} />,
      notifs:  <NotificationsScreen onNavigate={setScreen} />,
      profile: <ProfileScreen       onNavigate={setScreen} />,
    };
    return (
      <div style={{ position: 'relative', height: '100%', background: '#F5F7FA' }}>
        <div style={{ position: 'absolute', inset: 0, overflowY: 'auto', overflowX: 'hidden' }}>
          {screens[screen]}
        </div>
        <BottomNav active={screen} onChange={setScreen} />
      </div>
    );
  };
}

mountScreen('home-mount',    React.createElement(makeShell('home')));
mountScreen('book-mount',    React.createElement(makeShell('book')));
mountScreen('orders-mount',  React.createElement(makeShell('orders')));
mountScreen('notifs-mount',  React.createElement(makeShell('notifs')));
mountScreen('profile-mount', React.createElement(makeShell('profile')));
</script>
