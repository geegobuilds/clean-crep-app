<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Crep JA — Instagram Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0D1524; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; }

  #topbar {
    flex-shrink: 0; height: 52px; background: #0A1F44;
    border-bottom: 1px solid rgba(168,200,240,0.12);
    display: flex; align-items: center; padding: 0 28px; gap: 16px;
  }
  #topbar .logo-wrap { display: flex; align-items: center; gap: 10px; }
  #topbar .logo-wrap img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  #topbar .brand { font-size: 13px; font-weight: 500; color: #fff; }
  #topbar .sep { width: 1px; height: 24px; background: rgba(168,200,240,0.15); }
  #topbar .label { font-size: 11px; color: #A8C8F0; }
  #topbar .tabs { display: flex; gap: 4px; margin-left: auto; }
  #topbar .tabs button {
    background: none; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
    padding: 5px 13px; border-radius: 6px; color: #A8C8F0;
    transition: background 150ms, color 150ms;
  }
  #topbar .tabs button.active { background: rgba(168,200,240,0.15); color: #fff; }

  #canvas {
    flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden;
    display: flex; align-items: center; padding: 32px 48px; gap: 40px;
  }
  #canvas::-webkit-scrollbar { height: 5px; }
  #canvas::-webkit-scrollbar-thumb { background: rgba(168,200,240,0.2); border-radius: 3px; }

  .post-wrapper { display: flex; flex-direction: column; align-items: center; gap: 14px; flex-shrink: 0; }
  .post-label { font-size: 11px; font-weight: 500; color: #A8C8F0; text-transform: uppercase; letter-spacing: 2px; }
  .post-sublabel { font-size: 10px; color: rgba(168,200,240,0.45); margin-top: -10px; }

  /* Scale each 1080×1350 post to ~320px wide to fit viewport */
  .post-scaler {
    width: 320px; height: 400px; flex-shrink: 0;
    position: relative; overflow: hidden; border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3);
  }
  .post-scaler > div {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1350px;
    transform-origin: top left;
    transform: scale(calc(320 / 1080));
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo-wrap">
    <img src="assets/logo-cropped.png" alt="Clean Crep JA" />

  </div>
  <div class="sep"></div>
  <span class="label">Instagram Templates · 1080 × 1350</span>
  <div class="tabs">

    <a href="Operator Dashboard.html" style="color:#A8C8F0;font-size:11px;font-weight:500;text-decoration:none;padding:5px 13px;border-radius:6px;background:none;">Dashboard</a>
  </div>
</div>

<div id="canvas">
  <div class="post-wrapper">
    <span class="post-label">Service Promo</span>
    <div class="post-scaler"><div id="t1"></div></div>
    <span class="post-sublabel">Sneaker Clean · Primary CTA</span>
  </div>
  <div class="post-wrapper">
    <span class="post-label">Clarks Feature</span>
    <div class="post-scaler"><div id="t2"></div></div>
    <span class="post-sublabel">Clarks Clean · Premium tier</span>
  </div>
  <div class="post-wrapper">
    <span class="post-label">Before / After</span>
    <div class="post-scaler"><div id="t3"></div></div>
    <span class="post-sublabel">Results-led · Social proof</span>

    <span class="post-label">Loyalty Drop</span>
    <div class="post-scaler"><div id="t4"></div></div>
    <span class="post-sublabel">Points program · Retention</span>
  </div>
  <div class="post-wrapper">
    <span class="post-label">Location Card</span>
    <div class="post-scaler"><div id="t5"></div></div>
    <span class="post-sublabel">Find us · Half Way Tree</span>

<script type="text/babel">
const font = "'DM Sans', sans-serif";
const C = {
  navy: '#0A1F44', blue: '#1A6FD4', white: '#FFFFFF',
  offWhite: '#F5F7FA', ice: '#E8F1FB', softBlue: '#A8C8F0', caption: '#5A6A8A',
};

// ── Shared logo badge ─────────────────────────────────────────
function LogoBadge({ dark = false }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
      <img src="assets/logo-cropped.png" alt="Clean Crep JA" style={{ width: 72, height: 72, borderRadius: '50%', objectFit: 'cover' }} />
      <div>
        <div style={{ fontSize: 28, fontWeight: 500, color: dark ? C.white : C.navy, lineHeight: 1.1 }}>Clean Crep</div>
        <div style={{ fontSize: 22, fontWeight: 400, color: dark ? C.softBlue : C.caption, marginTop: 2 }}>Jamaica</div>
      </div>
    </div>
  );
}

// ── Overline ──────────────────────────────────────────────────
function Overline({ children, dark = false }) {
  return (
    <div style={{ fontSize: 22, fontWeight: 500, color: dark ? C.softBlue : C.blue, textTransform: 'uppercase', letterSpacing: 6, lineHeight: 1 }}>
      {children}
    </div>
  );
}

// ── Shoe illustration placeholder ─────────────────────────────
function ShoePlaceholder({ size = 400, color = C.ice, style = {} }) {
  return (
    <div style={{ width: size, height: size * 0.6, borderRadius: 24, background: color, display: 'flex', alignItems: 'center', justifyContent: 'center', ...style }}>
      <svg width={size * 0.55} height={size * 0.35} viewBox="0 0 220 140" fill="none">
        {/* Sole */}
        <ellipse cx="110" cy="120" rx="100" ry="16" fill="rgba(26,111,212,0.12)" />
        {/* Upper */}
        <path d="M20 100 Q10 60 50 40 Q90 20 140 30 Q180 38 200 70 Q210 88 190 100 Z" fill={color === C.ice ? C.navy : C.ice} opacity="0.15" />
        <path d="M20 100 Q10 60 50 40 Q90 20 140 30 Q180 38 200 70 Q210 88 190 100 Z" stroke={C.navy} strokeWidth="3" fill="none" opacity="0.3" />
        {/* Laces */}
        <line x1="80" y1="58" x2="130" y2="52" stroke={C.navy} strokeWidth="2.5" strokeLinecap="round" opacity="0.25" />
        <line x1="82" y1="68" x2="132" y2="62" stroke={C.navy} strokeWidth="2.5" strokeLinecap="round" opacity="0.25" />
        <line x1="84" y1="78" x2="134" y2="72" stroke={C.navy} strokeWidth="2.5" strokeLinecap="round" opacity="0.25" />
        {/* Swoosh-like accent */}
        <path d="M40 88 Q80 68 160 78" stroke={C.blue} strokeWidth="3" fill="none" strokeLinecap="round" opacity="0.35" />
      </svg>
    </div>
  );
}

// ── Starburst / badge ─────────────────────────────────────────
function PriceBadge({ price, note, dark = false }) {
  return (
    <div style={{
      display: 'inline-flex', flexDirection: 'column', alignItems: 'flex-start',
      borderLeft: `6px solid ${C.blue}`, paddingLeft: 24,
    }}>
      <div style={{ fontSize: 90, fontWeight: 700, color: dark ? C.white : C.navy, lineHeight: 0.95, letterSpacing: -2 }}>{price}</div>
      <div style={{ fontSize: 28, fontWeight: 400, color: dark ? C.softBlue : C.caption, marginTop: 8 }}>{note}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// TEMPLATE 1 — Sneaker Clean Promo (light bg)
// ─────────────────────────────────────────────────────────────
function T1() {
  return (

      <div style={{ position: 'absolute', bottom: -200, right: -200, width: 900, height: 900, borderRadius: '50%', background: C.ice, zIndex: 0 }} />

          </div>
          <div style={{ fontSize: 32, color: C.caption, lineHeight: 1.5, maxWidth: 700 }}>

          </div>
          <PriceBadge price="$2,000" note="JMD · Sneaker Clean" />

        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 48 }}>
          <ShoePlaceholder size={780} color={C.ice} />

        {/* Bottom */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div style={{ fontSize: 24, fontWeight: 500, color: C.navy }}>Shop 19, Pristine Plaza</div>
            <div style={{ fontSize: 22, color: C.caption, marginTop: 4 }}>Half Way Tree, Kingston</div>
          </div>
          <div style={{ background: C.blue, borderRadius: 16, padding: '22px 40px' }}>
            <div style={{ fontSize: 26, fontWeight: 500, color: C.white }}>Book Now</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────

          </div>
          <div style={{ fontSize: 30, color: C.softBlue, lineHeight: 1.5, maxWidth: 680 }}>

          </div>

          <div style={{ display: 'flex', gap: 24 }}>

              <div key={tag} style={{ borderRadius: 8, border: `1.5px solid rgba(168,200,240,0.3)`, padding: '14px 24px' }}>
                <span style={{ fontSize: 22, fontWeight: 500, color: C.softBlue }}>{tag}</span>
              </div>

        </div>

          <div>
            <div style={{ fontSize: 24, fontWeight: 500, color: C.white }}>Shop 19, Pristine Plaza</div>
            <div style={{ fontSize: 22, color: C.softBlue, marginTop: 4 }}>Half Way Tree, Kingston</div>
          </div>
          <div style={{ background: C.blue, borderRadius: 16, padding: '22px 40px' }}>
            <div style={{ fontSize: 26, fontWeight: 500, color: C.white }}>$3,500 JMD</div>
          </div>
        </div>
      </div>
    </div>
  );
}

            <svg width="22" height="18" viewBox="0 0 22 18" fill="none"><path d="M1 9h20M14 2l7 7-7 7M8 2L1 9l7 7" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>

  const pts = [100, 200, 300, 400, 500];

}
