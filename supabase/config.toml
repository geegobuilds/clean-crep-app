# Local Supabase CLI config. Run `supabase start` from the repo root
# (requires Docker) to spin up Postgres/Auth/Realtime/Studio locally.
# If your installed CLI version complains about missing keys, run
# `supabase init` once to regenerate this file, then re-apply the
# `project_id` below and keep migrations/seed.sql as-is.

project_id = "clean-crep-jamaica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "exp://127.0.0.1:19000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true
